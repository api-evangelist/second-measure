name: Second Measure
description: Bloomberg Second Measure provides alternative data analytics for investors, turning billions of anonymized
  U.S. consumer card-transaction purchases into daily insights on the performance of thousands of public and private
  companies and brands. It is a Bloomberg product delivered primarily through the Bloomberg Terminal (ALTD and ECAN
  commands) and via aggregated and transaction-level data feeds, with 2-, 3-, and 7-day delivery lags that support
  intra-quarter earnings forecasting and investment monitoring. Second Measure was founded as a Bessemer Venture
  Partners portfolio company and acquired by Bloomberg in 2020. As of this enrichment pass the company exposes no
  public developer API, developer portal, or machine-readable API specification; access is gated through Bloomberg
  data products rather than a self-serve web API.
